name: companion-release
# Builds a companion app release (Windows installer + Store package, Linux AppImage + .deb) and, when the Partner
# Center secrets exist, submits the Windows package to the Microsoft Store. Untick "Submit to the Microsoft Store"
# to publish only a GitHub release. The website links to the Linux files of the latest GitHub release.
#   Actions > companion-release > Run workflow, version e.g. 0.2.0   (creates the tag companion-v0.2.0)
#   or push a tag: git tag companion-v0.2.0, git push origin companion-v0.2.0
# The version is set at build time; package.json in the repo isn't changed. The Store needs every upload to
# have a higher version than the last one.
#
# Store upload secrets (Partner Center > Account settings > User management > Microsoft Entra applications):
#   PARTNER_CENTER_TENANT_ID, PARTNER_CENTER_CLIENT_ID, PARTNER_CENTER_CLIENT_SECRET,
#   PARTNER_CENTER_SELLER_ID (Account settings > Legal info > Seller ID).
# Without them the release is still built and attached to the GitHub release; only the Store step is skipped.
on:
  push:
    tags: ["companion-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0 (must be higher than the last Store upload)"
        required: true
      store:
        description: "Submit to the Microsoft Store"
        type: boolean
        default: true
concurrency:
  group: companion-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Version
        id: version
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          v="${INPUT:-${GITHUB_REF_NAME#companion-v}}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$v')"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      # Fixed file names (Cheatscanner-linux-x64.AppImage / .deb), so releases/latest/download/... always works.
      - run: npm run dist:linux
      - run: ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: companion-linux
          path: |
            companion/release/*.AppImage
            companion/release/*.deb

  release:
    needs: linux
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
        shell: bash
    env:
      STORE_ID: ${{ vars.STORE_PRODUCT_ID || '9N3R274VP3GV' }}
      HAS_STORE_SECRETS: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Version
        id: version
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          v="${INPUT:-${GITHUB_REF_NAME#companion-v}}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$v')"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      # Installer for the website download, then the Store package.
      - run: npm run dist
      - run: npx electron-builder --win appx --x64
      - run: ls -l release
      - uses: actions/download-artifact@v4
        with:
          name: companion-linux
          path: companion/release

      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ steps.version.outputs.version }}
          path: |
            companion/release/*.exe
            companion/release/*.appx

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Companion ${{ steps.version.outputs.version }}
          files: |
            companion/release/*.exe
            companion/release/*.appx
            companion/release/*.AppImage
            companion/release/*.deb

      - name: Set up the Microsoft Store CLI
        if: env.HAS_STORE_SECRETS == 'true' && (github.event_name == 'push' || github.event.inputs.store == 'true')
        uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Submit to the Microsoft Store
        if: env.HAS_STORE_SECRETS == 'true' && (github.event_name == 'push' || github.event.inputs.store == 'true')
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId "$TENANT_ID" --sellerId "$SELLER_ID" --clientId "$CLIENT_ID" --clientSecret "$CLIENT_SECRET"
          msstore publish "release/Cheatscanner-${{ steps.version.outputs.version }}.appx" -id "$STORE_ID"
      - name: Store step skipped
        if: env.HAS_STORE_SECRETS != 'true'
        run: echo "::notice::No Partner Center secrets, so nothing was sent to the Microsoft Store."
